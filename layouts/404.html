{{ define "main" }}


<section class="error-page">
  <div class="center">
    <div class="text-center py-5 my-5">
      {{ .Scratch.Set "logo_h" "56" }}
      {{- partial "_logo.html" . -}}
      <h1>404</h1>
      <h2 class="h3">Page not found</h2>
      <p>
        The link may be broken or the page may have been removed.<br />
        Need a hand? Call us on <a href="tel:+353861747745">086 174 77 45</a>.
      </p>
      <div class="mt-3">
        <a href="{{ .Site.Home.RelPermalink }}" class="btn"><b><span>Back to home</span><span>Back to home</span></b></a>
      </div>
    </div>
  </div>
</section>

<style>
  html,
  body {
    height: 100%;
    min-height: 100vh;
  }

  body {
    display: flex;
    flex-direction: column;
  }

  footer {
    display: none;
  }

  .btn_top {
    display: none;
  }

  .page__wrapper {
    flex: 1 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .text-center {
    text-align: center;
  }

  h1 {
    margin: 0 auto;
    font-size: 9em;
    font-weight: 700;
    line-height: 1;
  }

  .error-page a:not(.btn):not(.logo) {
    color: #E07B12;
  }

  .error-page .btn {
    margin: 1.5em auto 0;
  }

  .btn {
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
</style>

{{ end }}
