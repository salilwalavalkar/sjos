<div class="topbar">
    <div class="container topbar__row">
        <div class="topbar__contacts">
            {{- range .Site.Params.contacts }}
            {{- if in (slice "tel" "msg") .icon }}
            <a href="{{ .link | safeURL }}" class="topbar__link">
                <svg class="icon" width="14" height="14" aria-hidden="true">
                    <use xlink:href="#{{ .icon }}"></use>
                </svg>
                <span>{{ .title }}</span>
            </a>
            {{- end }}
            {{- end }}
        </div>
        <div class="topbar__soc">
            {{- partial "_soc.html" . -}}
        </div>
    </div>
</div>
