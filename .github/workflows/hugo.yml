# Build the Hugo site and deploy it to GitHub Pages.
# Runs on every push to main, or manually from the Actions tab.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel one that's already running.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.166.0
      HUGO_ENVIRONMENT: production
      # config.toml keeps relativeURLs = true for opening public/ locally, but Hugo's
      # relative URLs break when the site is served from a sub-folder (/sjos/),
      # so the deployed build uses normal root-relative URLs.
      HUGO_RELATIVEURLS: "false"
      TZ: Europe/Dublin
    steps:
      - name: Install Hugo (extended)
        run: |
          wget -q -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
          hugo version

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v6

      # base_url is the custom domain set in Settings → Pages (sjos.ie);
      # it's http:// until "Enforce HTTPS" is turned on, then https://.
      - name: Build
        run: |
          hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
